
name: iOS CI - SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-analyze:
    runs-on: macos-14

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Show available Xcode versions
      - name: Show available Xcode versions
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          echo ""
          echo "Currently selected Xcode:"
          xcodebuild -version

      # 3. Select Xcode 16.x
      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -print -quit)

          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16.x installation found."
            exit 1
          fi

          echo "Using Xcode: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version

      # 4. Install Ruby dependencies
      - name: Install Ruby dependencies
        run: bundle install

      # 5. Verify Xcode project
      - name: Verify Xcode project
        run: |
          test -f SonarCube.xcodeproj/project.pbxproj

          echo "Project format:"
          grep -n "objectVersion" SonarCube.xcodeproj/project.pbxproj

          echo ""
          echo "Available schemes:"
          xcodebuild -list -project SonarCube.xcodeproj

      # 6. Run tests with code coverage
      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -project SonarCube.xcodeproj \
            -scheme SonarCube \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      # 7. Convert Xcode coverage to SonarQube format
      - name: Convert coverage to SonarQube format
        run: |
          xcrun xccov view \
            --report \
            --json \
            TestResults.xcresult > coverage.json

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          with open("coverage.json") as f:
              data = json.load(f)

          coverage = ET.Element("coverage")

          for target in data.get("targets", []):
              for file in target.get("files", []):
                  file_path = file.get("path", "")
                  line_rate = file.get("lineCoverage", 0)

                  ET.SubElement(
                      coverage,
                      "file",
                      {
                          "path": file_path,
                          "line-rate": str(line_rate)
                      }
                  )

          tree = ET.ElementTree(coverage)

          tree.write(
              "sonarqube-generic-coverage.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print("Coverage XML generated successfully.")
          PY

          echo ""
          echo "Generated coverage file:"
          ls -lh sonarqube-generic-coverage.xml

      # 8. Install SwiftLint
      - name: Install SwiftLint
        run: |
          brew install swiftlint

      # 9. Run SwiftLint
      - name: Run SwiftLint
        run: |
          swiftlint lint \
            --reporter checkstyle \
            > swiftlint.xml

      # 10. SonarCloud analysis
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=SonarCube
            -Dsonar.organization=sai-tarun
            -Dsonar.sources=SonarCube
            -Dsonar.tests=SonarCubeTests,SonarCubeUITests
            -Dsonar.swift.coverage.reportPaths=sonarqube-generic-coverage.xml
            -Dsonar.swiftlint.reportPaths=swiftlint.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # 11. SonarCloud Quality Gate
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
