name: iOS CI - SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-analyze:
    runs-on: macos-14

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Show Xcode versions available on the GitHub runner
      - name: Show available Xcode versions
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          echo ""
          echo "Currently selected Xcode:"
          xcodebuild -version

      # 3. Select Xcode 16.x
      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -print -quit)

          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16.x installation found."
            exit 1
          fi

          echo "Using Xcode: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version

      # 4. Install Ruby dependencies
      - name: Install Ruby dependencies
        run: bundle install

      # 5. Verify Xcode project
      - name: Verify Xcode project
        run: |
          test -f SonarCube.xcodeproj/project.pbxproj

          echo "Project format:"
          grep -n "objectVersion" SonarCube.xcodeproj/project.pbxproj

          echo ""
          echo "Available schemes:"
          xcodebuild -list -project SonarCube.xcodeproj

      # 6. Run tests with code coverage
      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -project SonarCube.xcodeproj \
            -scheme SonarCube \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      # 7. Convert Xcode coverage to SonarQube format
      - name: Convert coverage to SonarQube format
        run: |
          xcrun xccov view \
            --report \
            --json \
            TestResults.xcresult > coverage.json

          curl -L \
            -o xccov-to-sonarqube-generic.sh \
            https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/master/swift-coverage/xccov-to-sonarqube-generic.sh

          chmod +x xccov-to-sonarqube-generic.sh

          ./xccov-to-sonarqube-generic.sh \
            coverage.json > sonarqube-generic-coverage.xml

      # 8. Install SwiftLint
      - name: Install SwiftLint
        run: |
          brew install swiftlint

      # 9. Run SwiftLint
      - name: Run SwiftLint
        run: |
          swiftlint lint \
            --reporter checkstyle \
            > swiftlint.xml

      # 10. SonarQube analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 11. SonarQube Quality Gate
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
